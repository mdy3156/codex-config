model = "gpt-6.1-sol"
model_reasoning_effort = "xhigh"
personality = "pragmatic"
service_tier = "default"

# Python 側で CODEX_HOME（未設定なら ~/.codex）を解決する。
notify = [
    "python3",
    "-c",
    "import os, runpy; runpy.run_path(os.path.expanduser(os.path.join(os.environ.get('CODEX_HOME', '~/.codex'), 'notify.py')), run_name='__main__')",
]

# 信頼するプロジェクトは移行先で個別に設定する。
# [projects."/absolute/path/to/project"]
# trust_level = "trusted"

[plugins."github@openai-curated"]
enabled = true

[plugins."google-calendar@openai-curated"]
enabled = true

[plugins."google-drive@openai-curated"]
enabled = true

[plugins."coderabbit@openai-curated"]
enabled = true

[plugins."codex-security@openai-curated"]
enabled = true

[plugins."build-web-apps@openai-curated"]
enabled = true

[plugins."superpowers@superpowers-dev"]
enabled = true

[plugins."ponytail@ponytail"]
enabled = true

[mcp_servers.codegraph]
command = "codegraph"
args = ["serve", "--mcp"]

[mcp_servers.codegraph.tools.codegraph_explore]
approval_mode = "approve"

[mcp_servers.codegraph.tools.codegraph_files]
approval_mode = "approve"

[marketplaces.superpowers-dev]
source_type = "git"
source = "https://github.com/obra/superpowers.git"
ref = "b36e0829c6d0140e93cfef2ca599b1b07d4a7797"

[marketplaces.ponytail]
source_type = "git"
source = "https://github.com/DietrichGebert/ponytail.git"
